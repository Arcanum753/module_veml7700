#------------------------- esp32 + veml7700 -------------------------
[env:esp32-veml7700]
extends = env:esp32
src_filter = ${platformio.src_filter} +<module_veml7700/> +<module_udp/> +<module_otaclient/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D DEBUG_VEML7700=1
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- esp8266 + veml7700 -------------------------
[env:esp8266-veml7700]
extends = env:esp8266
src_filter = ${platformio.src_filter} +<module_veml7700/> +<module_udp/> +<module_otaclient/>
build_flags=
	${env.build_flags}
	${env:esp8266.build_flags}
	-D DEBUG_VEML7700=1
lib_deps =
	${env.lib_deps}
	${env:esp8266.lib_deps}

#------------------------- registry (автогенерация modules_registry) -------------------------
[registry]
object = module_veml7700
define = MODULE_VEML7700
namespace = veml7700
web = 1
loop = 0
res = 1
